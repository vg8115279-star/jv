<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Times New Roman", Times, serif;
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .error-container {
            text-align: center;
            padding: 40px;
            max-width: 600px;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #800000;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .error-message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            color: #cccccc;
        }

        .back-link {
            display: inline-block;
            padding: 12px 30px;
            background-color: #800000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        .back-link:hover {
            background-color: #600000;
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page Not Found</h1>
        <p class="error-message">
            Sorry, the project you're looking for is not available yet. 
            This page is currently under development. Please check back later or return to the main site.
        </p>
        <a href="index.html" class="back-link">← Back to Home</a>
    </div>
</body>

</html>
